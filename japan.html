<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* 카카오톡·네이버·페이스북·인스타그램·라인·밴드 등 앱 안 브라우저로 열리면 기본 브라우저(크롬·사파리)로 다시 열기 */
(function () {
  if (window.top !== window.self) return;
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|NAVER\/|FBAN|FBAV|FB_IAB|FBIOS|Instagram|\bLine\/|DaumApps|BAND\/|everytimeApp|Whale\/[\d.]+ .*inapp|; wv\)/i.test(ua);
  if (!inApp) return;
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/\bLine\//i.test(ua)) {
    if (url.indexOf('openExternalBrowser=1') < 0) location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // 아이폰의 앱 안 브라우저는 사파리로 바로 넘길 수 없어 안내 화면을 띄움
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(20,24,32,.94);color:#f2f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 -apple-system,system-ui,sans-serif;word-break:keep-all';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리나 화면이 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래 ⋯ 또는 공유 버튼에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button type="button" data-a="copy" style="font:inherit;padding:10px 20px;border-radius:999px;border:0;background:#f2f3f6;color:#141820">주소 복사</button>' +
      '<button type="button" data-a="stay" style="font:inherit;background:none;border:0;color:#aab0bd;text-decoration:underline">그냥 여기서 보기</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (a === 'stay') box.remove();
      if (a === 'copy') {
        var b = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
          function () { b.textContent = '복사했어요'; },
          function () { window.prompt('주소를 복사해 사파리에 붙여 넣어 주세요', url); });
      }
    });
    document.body.appendChild(box);
  });
})();
</script>
  <title>일본의 주요 도시들</title>
  <link rel="stylesheet"
    href="https://s3.ap-northeast-2.amazonaws.com/materials.spartacodingclub.kr/easygpt/default.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBEGmiiFjkqhyKBRuFfdz3WqpPzLleeDMA&libraries=geometry&callback=initMap"
    async defer></script>


  <style>
    body {
      overflow-x: hidden;
      /* 가로 스크롤바를 숨김 처리합니다. */

    }

    #top {
      position: fixed;
      /* 고정 위치 설정 */
      top: 0;
      /* 화면 최상단에 배치 */
      left: 0;
      /* 왼쪽에서 시작 */
      right: 0;
      /* 오른쪽에서 시작 */
      text-align: center;
      /* 가운데 정렬 */
      background-color: rgba(255, 255, 255, 0.7);
      /* 배경 반투명 흰색 */
      padding: 5px;
      /* 패딩 설정 */
      z-index: 11;
      /* 다른 요소 위에 배치 */

    }

    p {
      font-size: 3vh;
    }

    div {
      font-size: 3vh;
    }

    button {
      font-size: 3vh;
    }

    h1 {
      font-size: 4vh;
      font-weight: bold;
    }


    #map {
      width: 100%;
      height: 100vh;
      /* 브라우저 창의 높이에 맞춰 지도를 설정 */
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #info-Container {
      position: fixed;
      bottom: calc(12vh);
      /* scoreboard의 높이만큼 여백 설정 */
      left: 0;
      right: 0;
      text-align: left;
      background-color: rgba(255, 255, 255, 0.7);
      padding-left: 10px;
      z-index: 20;

      font-weight: bold;
      display: none;
      align-items: center;
    }

    #scoreboard {
      position: fixed;
      height: 12vh;
      /* scoreboard의 높이를 고정 */
      bottom: 0;
      /* 화면 하단에 딱 붙어서 배치 */
      left: 0;
      right: 0;
      text-align: left;
      background-color: rgba(255, 255, 255, 0.7);
      padding-left: 10px;
      z-index: 20;
      display: flex;
      align-items: center;
    }


    #score {
      display: none;
    }

    #statistics {

      left: 10px;
    }

    .game-button {
      height: 6vh;
      background-color: lightpink;
      color: black;
      
      border-radius: 4px;
      cursor: pointer;
    }

    .centered-button {
      margin-top: 10px;
      display: grid;
      place-items: center;
      height: 100%;
      /* 또는 원하는 높이 */
      width: 100%;
      /* 또는 원하는 너비 */

    }
  </style>
</head>

<body>

  <div id="top">
    <h1 id="cityName" style="display: flex; justify-content: center; margin-top: 0; margin-bottom: 0;">City</h1>
    <div id="alarm"></div>
    <div id="buttons" style="display: flex; justify-content: center; padding-top: 10px;">
      <button id="submitGuess" class="game-button">실제 어디에 있는지 확인</button>

    </div>
  </div>
  <div id="map"></div>

  <div id="info-Container">

    <div id="descriptionContainer"></div>
    <button id="nextQuestion" class="game-button" style="display:none;">다음 문제</button>
  </div>
  <div id="scoreboard">
    <span id="score">점수: 0</span>
    <div id="statistics">
      <span>지금까지 </span><span id="total-question">0</span> 개의 도시를 알아보았습니다.<br> </span>
      <span>점수: </span><span id="current-score">0</span>/<span id="total-score">0</span>
      <span>&nbsp&nbsp 정답률: </span><span id="percentage">0.00</span>%
      <span>&nbsp&nbsp 레벨: </span><span id="level">1</span>
    </div>

    <div id="messageBox"
      style="display:none; position:fixed; justify-content: center; padding-top: 10px; top:50%; left:50%; transform:translate(-50%, -50%); background-color:rgba(0, 0, 0, 0.7); color:white; padding:20px; border-radius:10px;">
      <p id="messageText"></p>
      <button id="nextLevel" style="display:none" class="centered-button">다음 레벨</button>
      <button id="tryAgain" style="display:none" class="centered-button">다시 시작</button>
      <button id="exitGame" style="display:none" class="centered-button">나가기</button>

    </div>



    <script src="japan.js"></script>
</body>

</html>
